<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CodeClash</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="images/logo.png" alt="CodeClash" class="brand-icon-img" onerror="this.style.display='none'; document.getElementById('fallbackIcon').style.display='inline-flex';">
      <span class="brand-icon" id="fallbackIcon" style="display:none;"><i data-lucide="swords" style="width:18px;height:18px;"></i></span>
      <span>Code<span class="brand-text-accent">Clash</span></span>
    </a>

    <div class="nav-links">
      <a href="index.html#challenges" class="nav-link"><i data-lucide="code-2" style="width:15px;height:15px;"></i> Challenges</a>
      <a href="leaderboard.html" class="nav-link"><i data-lucide="trophy" style="width:15px;height:15px;"></i> Leaderboard</a>
    </div>

    <nav class="nav-links">
      <span class="nav-status-pill"><span class="nav-status-dot"></span> Arena Online</span>
      <a href="register.html" class="btn btn-primary btn-sm">Create Profile</a>
    </nav>
  </header>

  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 170px);">
    <div class="auth-wrapper">
      <div class="auth-header">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--accent-coral-subtle); border: 1px solid var(--border-accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--accent-coral);">
          <i data-lucide="log-in" style="width:22px;height:22px;"></i>
        </div>
        <h2>Welcome Back</h2>
        <p>Login to enter coding lobbies and climb the ladder</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="usernameOrEmail">Username or Email</label>
          <input type="text" id="usernameOrEmail" class="form-input" placeholder="e.g. byte_master" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 0.75rem; padding: 0.85rem;">
          <i data-lucide="swords" style="width:18px;height:18px;"></i>
          <span>Enter Battle Arena</span>
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-secondary);">
        New to CodeClash? <a href="register.html" style="color: var(--accent-coral); text-decoration: none; font-weight: 700; font-family: var(--font-display);">Register your profile</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div style="display: flex; align-items: center; gap: 0.45rem;">
        <i data-lucide="swords" style="width:16px;height:16px;color:var(--accent-coral);"></i> CodeClash — 1v1 Competitive Coding Platform
      </div>
      <div style="color: var(--text-muted); font-size: 0.85rem;">&copy; 2026 CodeClash</div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Authenticating...';

      const usernameOrEmail = document.getElementById('usernameOrEmail').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await API.login(usernameOrEmail, password);
        if (response.success) {
          alertBox.className = 'alert alert-success';
          alertBox.innerText = '✓ Login successful! Entering the arena...';
          alertBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        } else {
          alertBox.className = 'alert alert-error';
          alertBox.innerText = response.message || 'Invalid credentials';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.innerText = err.message || 'Unable to connect to server';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="swords" style="width:18px;height:18px;"></i> <span>Enter Battle Arena</span>';
        if (window.lucide) lucide.createIcons();
      }
    });
  </script>
</body>
</html>
