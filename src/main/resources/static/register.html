<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CodeClash</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div style="display: flex; align-items: center; gap: 1.5rem;">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">⚔️</span>
        <span>Code<span class="brand-text-accent">Clash</span></span>
      </a>
      <div style="display: flex; align-items: center; gap: 1.25rem;">
        <a href="index.html#challenges" class="nav-link">Challenges</a>
        <a href="leaderboard.html" class="nav-link">🏆 Leaderboard</a>
      </div>
    </div>

    <!-- Retro Pac-Man Animated Navbar Track -->
    <div class="pacman-track">
      <div class="pacman-dots-bg">
        <span class="pacman-dot"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-energizer"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-energizer"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-dot"></span>
        <span class="pacman-dot"></span>
      </div>
      <div class="pacman-squad-runner">
        <div class="pacman-char">
          <div class="pacman-top"></div>
          <div class="pacman-bottom"></div>
        </div>
        <div class="ghost-char ghost-red">
          <div class="ghost-eyes">
            <div class="ghost-eye"></div>
            <div class="ghost-eye"></div>
          </div>
          <div class="ghost-skirt">
            <div class="ghost-tentacle"></div>
            <div class="ghost-tentacle"></div>
            <div class="ghost-tentacle"></div>
          </div>
        </div>
        <div class="ghost-char ghost-cyan">
          <div class="ghost-eyes">
            <div class="ghost-eye"></div>
            <div class="ghost-eye"></div>
          </div>
          <div class="ghost-skirt">
            <div class="ghost-tentacle"></div>
            <div class="ghost-tentacle"></div>
            <div class="ghost-tentacle"></div>
          </div>
        </div>
      </div>
    </div>

    <nav class="nav-links">
      <span class="nav-status-pill">🟢 Arena Online</span>
      <a href="login.html" class="btn btn-outline">Existing Player Login</a>
    </nav>
  </header>

  <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 170px);">
    <div class="auth-wrapper" style="width: 100%; max-width: 460px; margin: 0 auto;">
      <div class="auth-header">
        <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">👑</div>
        <h2>Create Duelist Profile</h2>
        <p>Start with a default 1200 Elo and climb the rankings</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="username">Duelist Handle (Username)</label>
          <input type="text" id="username" class="form-input" placeholder="e.g. algo_ninja" required minlength="3" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="coder@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; margin-top: 0.75rem; padding: 0.85rem;">
          ⚡ Initialize Player Profile
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-secondary);">
        Already have a profile? <a href="login.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 700; font-family: var(--font-display);">Login to battle</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div>⚔️ CodeClash — 1v1 Competitive Coding Platform</div>
      <div style="color: var(--text-muted); font-size: 0.85rem;">&copy; 2026 CodeClash</div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating profile...';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await API.register(username, email, password);
        if (response.success) {
          alertBox.className = 'alert alert-success';
          alertBox.innerText = '✓ Profile created! Loading dashboard...';
          alertBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 700);
        } else {
          alertBox.className = 'alert alert-error';
          alertBox.innerText = response.message || 'Registration failed';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.innerText = err.message || 'Unable to connect to server';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '⚡ Initialize Player Profile';
      }
    });
  </script>
</body>
</html>
