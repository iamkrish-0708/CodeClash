<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena — CodeClash</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Monaco Editor Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .arena-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }
    .timer-badge {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.9rem;
      border-radius: var(--radius-md);
      color: var(--accent-cyan);
    }
    .arena-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
    }
    /* Left Panel */
    .panel-left {
      width: 45%;
      border-right: 1px solid var(--border-color);
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
    }
    .panel-body {
      padding: 1.5rem;
      flex: 1;
      overflow-y: auto;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .panel-body pre {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      margin: 0.75rem 0;
      white-space: pre-wrap;
    }
    /* Right Panel */
    .panel-right {
      width: 55%;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
    }
    .editor-container {
      flex: 1;
      min-height: 250px;
    }
    .console-panel {
      height: 220px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
    }
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .console-body {
      padding: 0.75rem 1rem;
      flex: 1;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 0.6rem 1rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }
    .tc-result-item {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
    }
    .tc-pass { border-left: 4px solid var(--accent-green); }
    .tc-fail { border-left: 4px solid var(--accent-red); }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <header class="arena-nav">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="dashboard.html" class="nav-brand" style="font-size: 1.15rem;">
        <span class="brand-icon">⚔️</span>
        <span id="arenaTitle">CodeClash Arena</span>
      </a>
      <span class="badge badge-easy" id="problemDifficultyBadge">EASY</span>
    </div>

    <div class="timer-badge" id="matchTimer">⏱️ 15:00</div>

    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span id="userStatus" style="font-size: 0.85rem; color: var(--text-secondary);">Player: ...</span>
    </div>
  </header>

  <!-- Arena 2-Column Split -->
  <div class="arena-layout">
    <!-- Left Problem Panel -->
    <div class="panel-left">
      <div class="panel-header">
        <h2 id="problemTitle" style="font-size: 1.35rem; font-weight: 800;">Loading Problem...</h2>
        <div style="display: flex; gap: 0.75rem; margin-top: 0.4rem; font-size: 0.85rem; color: var(--text-muted);">
          <span>⏱️ Time Limit: <span id="timeLimit">15</span> min</span>
          <span>💾 Memory: <span id="memoryLimit">128</span> MB</span>
          <span>☕ Language: Java</span>
        </div>
      </div>
      <div class="panel-body" id="problemDescription">
        Loading challenge description...
      </div>
    </div>

    <!-- Right Editor Panel -->
    <div class="panel-right">
      <div id="monacoEditor" class="editor-container"></div>
      <!-- Fallback textarea for offline if CDN is unavailable -->
      <textarea id="fallbackEditor" style="display:none; width:100%; height:100%; background:#1e1e1e; color:#f8fafc; font-family:monospace; padding:1rem; border:none; resize:none;"></textarea>

      <!-- Bottom Console Output -->
      <div class="console-panel">
        <div class="console-header">
          <span id="consoleStatusText">Console Output & Test Results</span>
          <span id="executionTimeBadge" style="color: var(--text-muted); font-family: var(--font-mono);"></span>
        </div>
        <div class="console-body" id="consoleOutput">
          <span style="color: var(--text-muted);">Hit "Run Sample Cases" to compile and test your code...</span>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <button class="btn btn-outline" id="runSampleBtn" onclick="handleRunSample()">
          ▶ Run Sample Cases
        </button>
        <button class="btn btn-primary" id="submitBtn" onclick="handleSubmit()">
          🚀 Submit Solution
        </button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let editorInstance = null;
    let currentProblemId = null;
    let currentMatchId = null;

    // Parse URL params (e.g. ?problemId=1 or ?matchId=5)
    const urlParams = new URLSearchParams(window.location.search);
    currentProblemId = urlParams.get('problemId') || 1;
    currentMatchId = urlParams.get('matchId') || null;

    // Check Auth
    async function initUser() {
      try {
        const user = await API.getCurrentUser();
        document.getElementById('userStatus').innerText = `👤 ${user.username} (${user.rating} Elo)`;
      } catch (e) {
        document.getElementById('userStatus').innerText = `Guest (Practice Mode)`;
      }
    }

    // Load Problem
    async function loadProblem() {
      try {
        const problem = await API.getProblem(currentProblemId);
        document.getElementById('problemTitle').innerText = problem.title;
        document.getElementById('problemDifficultyBadge').innerText = problem.difficulty;
        document.getElementById('problemDifficultyBadge').className = `badge badge-${problem.difficulty.toLowerCase()}`;
        document.getElementById('timeLimit').innerText = Math.floor(problem.timeLimitSeconds / 60);
        document.getElementById('memoryLimit').innerText = problem.memoryLimitMb;
        
        // Simple markdown to HTML format
        const formattedDesc = problem.description
          .replace(/### (.*)/g, '<h3 style="font-size:1.1rem; margin:1rem 0 0.4rem; color:var(--text-primary); font-weight:700;">$1</h3>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code style="background:var(--bg-input); padding:0.15rem 0.35rem; border-radius:4px; font-family:var(--font-mono); color:var(--accent-cyan);">$1</code>')
          .replace(/\n\n/g, '<br><br>')
          .replace(/\n/g, '<br>');

        document.getElementById('problemDescription').innerHTML = formattedDesc;

        // Initialize Editor with Starter Code
        initMonaco(problem.starterCodeJava || '// Write your Java solution here\nimport java.util.*;\n\npublic class Solution {\n    public static void main(String[] args) {\n        \n    }\n}');
      } catch (err) {
        document.getElementById('problemDescription').innerHTML = `<p style="color:var(--accent-red)">Error loading problem: ${err.message}</p>`;
      }
    }

    // Initialize Monaco Editor
    function initMonaco(starterCode) {
      if (window.require) {
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
          editorInstance = monaco.editor.create(document.getElementById('monacoEditor'), {
            value: starterCode,
            language: 'java',
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 14,
            fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
            minimap: { enabled: false },
            lineNumbers: 'on',
            roundedSelection: false,
            scrollBeyondLastLine: false,
            readOnly: false,
          });
        });
      } else {
        // Fallback
        const fallback = document.getElementById('fallbackEditor');
        fallback.style.display = 'block';
        fallback.value = starterCode;
      }
    }

    function getEditorCode() {
      if (editorInstance) {
        return editorInstance.getValue();
      }
      return document.getElementById('fallbackEditor').value;
    }

    // Run Sample Test Cases
    async function handleRunSample() {
      const btn = document.getElementById('runSampleBtn');
      const consoleOutput = document.getElementById('consoleOutput');
      const timeBadge = document.getElementById('executionTimeBadge');
      
      btn.disabled = true;
      btn.innerText = '⏳ Running...';
      consoleOutput.innerHTML = '<span style="color:var(--accent-cyan)">Compiling and executing against sample test cases...</span>';

      try {
        const code = getEditorCode();
        const res = await API.runSample(currentProblemId, code, currentMatchId);
        
        timeBadge.innerText = `${res.executionTimeMs || 0} ms`;
        renderConsoleResults(res, false);
      } catch (err) {
        consoleOutput.innerHTML = `<span style="color:var(--accent-red)">Execution Failed: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '▶ Run Sample Cases';
      }
    }

    // Submit Solution
    async function handleSubmit() {
      const btn = document.getElementById('submitBtn');
      const consoleOutput = document.getElementById('consoleOutput');
      const timeBadge = document.getElementById('executionTimeBadge');

      btn.disabled = true;
      btn.innerText = '🚀 Submitting...';
      consoleOutput.innerHTML = '<span style="color:var(--accent-cyan)">Grading all test cases (including hidden tests)...</span>';

      try {
        const code = getEditorCode();
        const res = await API.submitCode(currentProblemId, code, currentMatchId);

        timeBadge.innerText = `${res.executionTimeMs || 0} ms`;
        renderConsoleResults(res, true);
      } catch (err) {
        consoleOutput.innerHTML = `<span style="color:var(--accent-red)">Submission Failed: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = '🚀 Submit Solution';
      }
    }

    // Render Results in Console
    function renderConsoleResults(res, isFinal) {
      const consoleOutput = document.getElementById('consoleOutput');
      const statusText = document.getElementById('consoleStatusText');

      let statusColor = 'var(--accent-green)';
      if (res.status === 'WRONG_ANSWER') statusColor = 'var(--accent-orange)';
      if (res.status === 'COMPILATION_ERROR' || res.status === 'RUNTIME_ERROR' || res.status === 'TIME_LIMIT_EXCEEDED') statusColor = 'var(--accent-red)';

      statusText.innerHTML = `<span style="color:${statusColor}; font-weight:800;">${res.status}</span> — Passed: ${res.passedTestCases}/${res.totalTestCases} Tests`;

      if (res.status === 'COMPILATION_ERROR') {
        consoleOutput.innerHTML = `
          <div style="color:var(--accent-red); font-weight:700; margin-bottom:0.5rem;">Compilation Error:</div>
          <pre style="background:var(--bg-input); padding:0.75rem; border-radius:6px; color:#fca5a5; white-space:pre-wrap;">${res.compileOutput}</pre>
        `;
        return;
      }

      let html = '';
      if (res.testCaseResults && res.testCaseResults.length > 0) {
        html = res.testCaseResults.map(tc => `
          <div class="tc-result-item ${tc.passed ? 'tc-pass' : 'tc-fail'}">
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.85rem; margin-bottom:0.25rem;">
              <span>Test Case #${tc.testCaseIndex} ${tc.isHidden ? '(Hidden)' : ''}</span>
              <span style="color:${tc.passed ? 'var(--accent-green)' : 'var(--accent-red)'}">
                ${tc.passed ? '✓ PASSED' : '✗ FAILED'}
              </span>
            </div>
            ${!tc.isHidden ? `
              <div style="font-size:0.8rem; color:var(--text-secondary);">
                <div><strong>Input:</strong> ${tc.input.replace(/\n/g, ' ')}</div>
                <div><strong>Expected:</strong> ${tc.expectedOutput}</div>
                <div><strong>Your Output:</strong> ${tc.actualOutput}</div>
                ${tc.error ? `<div style="color:var(--accent-red)"><strong>Error:</strong> ${tc.error}</div>` : ''}
              </div>
            ` : `<div style="font-size:0.8rem; color:var(--text-muted);">${tc.passed ? 'Secret grading test case passed.' : 'Failed secret grading test case.'}</div>`}
          </div>
        `).join('');
      }

      if (isFinal && res.status === 'ACCEPTED') {
        html = `
          <div style="background:rgba(16,185,129,0.15); border:1px solid var(--accent-green); padding:0.75rem; border-radius:6px; margin-bottom:0.75rem; color:#86efac; font-weight:700;">
            🎉 All Test Cases Passed! Solution Accepted.
          </div>
        ` + html;
      }

      consoleOutput.innerHTML = html;
    }

    initUser();
    loadProblem();
  </script>
</body>
</html>
