spring.application.name=codeclash

# Server Configuration (Supports cloud PORT env var, defaults to 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (Supports Cloud DB or falls back to local MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/codeclash_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Krish@718}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Request Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
