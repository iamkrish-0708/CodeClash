spring.application.name=codeclash

# Server Port
server.port=${PORT:8080}
server.address=0.0.0.0

# Default Database: Embedded Zero-Config H2 (compatible with MySQL mode)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/codeclash;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
